<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e30b17">
<title>Pakuwon Surplus</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="toast" class="toast"></div>
<header class="topbar">
  <a class="brand" href="#/home"><span class="brand-mark">P</span><span>Pakuwon <b>Surplus</b></span></a>
  <button class="location-pill" id="locationBtn" title="Kelola alamat pengiriman">
    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"></path>
      <circle cx="12" cy="9" r="2.4"></circle>
    </svg>
    <span><small>Kirim ke</small><strong id="locationText">Pilih alamat</strong></span>
  </button>
  <div class="search-wrap">
    <span>⌕</span>
    <input id="globalSearch" placeholder="Cari produk, tenant, atau kategori">
    <kbd>⌘ K</kbd>
  </div>
  <nav class="header-actions">
    <a href="#/catalog">Eksplor</a>
    <a class="icon-btn cart-link" href="#/cart" aria-label="Keranjang">
      <svg class="nav-icon cart-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 4h2l2.1 10.2h9.8L19 7H6.2"></path>
        <circle cx="9" cy="19" r="1.25"></circle>
        <circle cx="17" cy="19" r="1.25"></circle>
      </svg>
      <span class="count" id="cartCount">0</span>
    </a>
    <button class="account-btn" id="accountBtn"><span class="avatar">A</span><span class="account-label">Masuk</span></button>
  </nav>
</header>

<main id="app"></main>

<nav class="mobile-nav">
  <a href="#/home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10.5V20h13v-9.5"></path></svg><span>Home</span></a>
  <a href="#/catalog"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg><span>Cari</span></a>
  <a href="#/cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.2h9.8L19 7H6.2"></path><circle cx="9" cy="19" r="1.2"></circle><circle cx="17" cy="19" r="1.2"></circle></svg><span>Keranjang</span></a>
  <button id="mobileAccount"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"></circle><path d="M5 20c1.5-4 3.8-6 7-6s5.5 2 7 6"></path></svg><span>Akun</span></button>
</nav>

<div class="modal-backdrop hidden" id="modal">
  <div class="modal-card" id="modalCard"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
